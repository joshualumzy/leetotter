<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leetotter</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="panel" class="panel">
    <header class="top">
      <button id="header-otter" class="otter-tile" type="button" title="Settings" aria-label="Settings" aria-expanded="false"></button>
      <div id="problem-title" class="title">Leetotter</div>
      <div id="timer" class="timer" hidden><strong id="elapsed"></strong><span id="cap"></span></div>
      <div id="controls" class="controls"></div>
      <div class="status"><span id="status-dot" class="dot"></span><span id="remark"></span></div>
    </header>
    <main id="session-body" class="body"></main>
    <div id="composer" class="composer" hidden></div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
