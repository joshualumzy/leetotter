<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leetotter</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="panel" class="panel">
    <header class="top">
      <button id="header-otter" class="otter-tile" type="button" title="Settings" aria-label="Settings" aria-expanded="false"></button>
      <div id="problem-title" class="title">Leetotter</div>
      <div id="timer" class="timer" hidden><strong id="clock"></strong></div>
      <div id="controls" class="controls"></div>
      <div class="status"><span id="status-dot" class="dot"></span><span id="remark"></span></div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Panel sections">
      <button id="tab-session" class="tab" type="button">Session</button>
      <button id="tab-recaps" class="tab" type="button">Recaps<span id="recaps-unread" class="tab-dot" aria-label="Unread recap" hidden></span></button>
      <button id="tab-progress" class="tab" type="button">Progress</button>
    </nav>
    <main id="session-body" class="body"></main>
    <div id="composer" class="composer" hidden></div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
