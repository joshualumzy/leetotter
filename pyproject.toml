[project]
name = "leetotter-companion"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fsrs==6.3.2",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "websockets>=15,<17",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["companion"]
